[project]
name = "torchmeter"
version = "0.1.0"
description = "Simple, reproducible performance benchmarking for PyTorch models."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pujan Neupane", email = "pujanneupaneop0907@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
torchmeter = "torchmeter.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
