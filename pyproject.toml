[project]
name = "torchmeter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pujan neupane", email = "pujanneupaneop0907@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
torchmeter = "torchmeter:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
